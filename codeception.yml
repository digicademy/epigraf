paths:
    tests: tests/Codeception
    output: tests/Codeception/_output
    data: tests/Codeception/_data
    support: tests/Codeception/_support
    envs: tests/Codeception/_envs
coverage:
  enabled: true
  include:
    - src/*
    - plugins/*/src/*
    - htdocs/*
    - templates/*
    - plugins/*
  exclude:
    - src/Console/*
    - vendor/*
  show_only_summary: false
actor_suffix: Tester
extensions:
    enabled:
        - Codeception\Extension\RunFailed
