# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Perform tests in browser using the WebDriver or PhpBrowser.
# If you need both WebDriver and PHPBrowser tests - create a separate suite.

actor: AcceptanceTester
coverage:
  remote: true
  c3_url: 'http://localhost/c3.php'
modules:
    enabled:
        - WebDriver:
            url: http://localhost
            browser: firefox
            window_size: 1280x800  # Fix for strange screenshot size: 1280x848
            host: 127.0.0.1
            port: 4444
            path: /
            capabilities:
              "moz:firefoxOptions":
                binary: "/usr/bin/firefox"
                args:
                  - "-headless"
                prefs:
                  layers.acceleration.disabled: true

                  gfx.direct2d.disabled: true
                  gfx.webrender.all: false
                  gfx.webrender.enabled: false
                  gfx.canvas.azure.accelerated: false
                  gfx.content.azure.accelerated: false
                  gfx.font_rendering.cleartype_params.pixel_structure: 0
                  gfx.font_rendering.directwrite.use_gdi_table_loading: false
                  gfx.font_rendering.cleartype_params.rendering_mode: 1
                  gfx.downloadable_fonts.disable_cache: true
                  gfx.use_text_smoothing_setting: true
                  gfx.text.subpixel-position.force-enabled: false
                  gfx.color_management.mode: 0
                  gfx.color_management.enablev4: false

                  canvas.color_management.enabled: false
                  image.color_management.intent: -1
                  layout.css.devPixelsPerPx: "1.0"
                  general.smoothScroll: false
        - VisualCeption:
            maximumDeviation: 0.1             # deviation in percent (mean squared error over all channels, keep it low)
            saveCurrentImageIfFailure: true   # if true, VisualCeption saves the current
            fullScreenShot: false             # fullpage screenshot
            referenceImageDir: references/
            currentImageDir: current/
        - Db:
            dsn: 'mysql:host=test_sql'
            user: 'root'
            password: 'root'
            databases:
              test_epigraf:
                dsn: 'mysql:host=test_sql'
                user: 'root'
                password: 'root'
                dbname: 'test_epigraf'
                dump: 'tests/Testdata/Databases/test_epigraf.sql'
                populate: true # run populator before all tests
                cleanup: true # run populator before each test
                initial_queries:
                  - 'CREATE DATABASE IF NOT EXISTS test_epigraf CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
                  - 'USE test_epigraf;'
                  - 'SET NAMES utf8;'
                populator: 'mysql --skip-ssl -u $user -p$password -h $host $dbname < $dump'
              test_projects:
                dsn: 'mysql:host=test_sql'
                user: 'root'
                password: 'root'
                dbname: 'test_projects'
                dump: 'tests/Testdata/Databases/test_projects.sql'
                populate: true # run populator before all tests
                cleanup: true # run populator before each test
                initial_queries:
                  - 'CREATE DATABASE IF NOT EXISTS test_projects CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
                  - 'USE test_projects;'
                  - 'SET NAMES utf8 COLLATE utf8_unicode_ci;'
                populator: 'mysql --skip-ssl -u $user -p$password -h $host --default-character-set=utf8 $dbname < $dump'
        - \Helper\Acceptance
        - \Codeception\Module\Asserts
step_decorators: ~
extensions:
  enabled:
    - Codeception\Extension\RunProcess:
        0: bash tests/Codeception/start-selenium.sh
        sleep: 2
